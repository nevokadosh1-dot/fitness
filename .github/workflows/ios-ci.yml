name: iOS CI

on:
  workflow_dispatch:
  push:
    branches:
      - claude/fitness-app-ios-800sje
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: forge-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test Forge (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment report
        run: |
          {
            echo "== macOS =="
            sw_vers
            echo "== Hardware =="
            uname -a
            echo "== Default Xcode =="
            xcodebuild -version
            echo "== Swift =="
            swift --version
            echo "== Active developer directory =="
            xcode-select -p
            echo "== Installed Xcode applications =="
            ls -1 /Applications | grep Xcode || true
            echo "== Installed SDKs =="
            xcodebuild -showsdks
            echo "== Available simulators =="
            xcrun simctl list devices available
            echo "== Commit =="
            git rev-parse HEAD
            echo "== Branch =="
            git branch --show-current || echo "(detached: ${GITHUB_REF})"
          } 2>&1 | tee "$RUNNER_TEMP/environment.txt"

      - name: Select Xcode (prefer stable Xcode 16)
        run: |
          set -euo pipefail
          echo "Xcode installations found:"
          ls -1d /Applications/Xcode*.app || true
          # Newest stable Xcode 16.x, excluding beta / release-candidate installs.
          STABLE_16=$(ls -1d /Applications/Xcode_16*.app 2>/dev/null | grep -viE 'beta|rc' | sort -V | tail -1 || true)
          if [ -n "$STABLE_16" ]; then
            echo "Selecting stable Xcode 16: $STABLE_16"
            sudo xcode-select -s "$STABLE_16/Contents/Developer"
          else
            echo "No stable Xcode 16 installation found."
            echo "Using the runner's default stable Xcode at: $(xcode-select -p)"
          fi
          echo "Active toolchain after selection:"
          xcodebuild -version
          swift --version

      - name: Inspect Xcode project
        run: |
          set -o pipefail
          xcodebuild -list -project Forge.xcodeproj 2>&1 | tee "$RUNNER_TEMP/project-list.log"
          xcodebuild -project Forge.xcodeproj -scheme Forge -showBuildSettings 2>&1 | tee "$RUNNER_TEMP/build-settings.log"

      - name: Select iPhone simulator dynamically
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - "$RUNNER_TEMP/simulators.json" > "$RUNNER_TEMP/sim.env" <<'PYEOF'
          import json, re, sys

          data = json.load(open(sys.argv[1]))
          best = None  # ((major, minor), name, udid, runtime)
          for runtime, devices in data.get("devices", {}).items():
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not match:
                  continue
              version = (int(match.group(1)), int(match.group(2)))
              for device in devices:
                  if not device.get("isAvailable"):
                      continue
                  if "iPhone" not in device.get("name", ""):
                      continue
                  if best is None or version > best[0]:
                      best = (version, device["name"], device["udid"], runtime)
          if best is None:
              sys.stderr.write("ERROR: no available iPhone simulator on this runner\n")
              sys.exit(1)
          print(f"SIMULATOR_NAME={best[1]}")
          print(f"SIMULATOR_UDID={best[2]}")
          print(f"SIMULATOR_RUNTIME={best[3]}")
          PYEOF
          echo "Selected destination:"
          cat "$RUNNER_TEMP/sim.env"
          cat "$RUNNER_TEMP/sim.env" >> "$GITHUB_ENV"

      - name: Boot simulator
        run: |
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          echo "Simulator $SIMULATOR_NAME ($SIMULATOR_RUNTIME) is booted."

      - name: Build Forge for simulator
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project Forge.xcodeproj \
            -scheme Forge \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/ForgeDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/forge-build.log"

      - name: Run unit tests (ForgeTests)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Forge.xcodeproj \
            -scheme Forge \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/ForgeDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/ForgeTests.xcresult" \
            -only-testing:ForgeTests \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/forge-tests.log"

      - name: Run UI tests (ForgeUITests)
        # The UI tests set -UITestMode / -UITestSampleData launch arguments
        # themselves via XCUIApplication.launchArguments.
        run: |
          set -o pipefail
          xcodebuild test \
            -project Forge.xcodeproj \
            -scheme Forge \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/ForgeDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/ForgeUITests.xcresult" \
            -only-testing:ForgeUITests \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/forge-ui-tests.log"

      - name: Test summary
        if: always()
        run: |
          for bundle in ForgeTests ForgeUITests; do
            if [ -d "$RUNNER_TEMP/$bundle.xcresult" ]; then
              echo "===== $bundle result summary ====="
              xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/$bundle.xcresult" || true
            fi
          done
          echo "===== Executed lines from logs ====="
          grep -hE "Executed [0-9]+ test" "$RUNNER_TEMP/forge-tests.log" "$RUNNER_TEMP/forge-ui-tests.log" 2>/dev/null || echo "(no 'Executed' lines found)"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-ios-ci-diagnostics
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/environment.txt
            ${{ runner.temp }}/project-list.log
            ${{ runner.temp }}/build-settings.log
            ${{ runner.temp }}/simulators.json
            ${{ runner.temp }}/forge-build.log
            ${{ runner.temp }}/forge-tests.log
            ${{ runner.temp }}/forge-ui-tests.log
            ${{ runner.temp }}/ForgeTests.xcresult
            ${{ runner.temp }}/ForgeUITests.xcresult
